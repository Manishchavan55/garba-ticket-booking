spring:
  application:
    name: garba-ticket-booking-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/garba_ticket_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true

server:
  port: 8081
